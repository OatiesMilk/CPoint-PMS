name: CI

on:
  push:
    branches: [main] # work arrives by pull request (D-032)
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: check
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: cpoint
          POSTGRES_PASSWORD: cpoint_ci_password
          POSTGRES_DB: cpoint_pms
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cpoint -d cpoint_pms"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://cpoint:cpoint_ci_password@localhost:5432/cpoint_pms?schema=public
      AUTH_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
      SEED_DEMO_USERS: "true"
      DEMO_USER_PASSWORD: ci-demo-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run db:deploy
      - run: npm run build
      - run: npm run test:e2e

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: check
    steps:
      - uses: actions/checkout@v4
      - name: Write .env for the stack
        run: |
          cp .env.example .env
          sed -i "s|^AUTH_SECRET=.*|AUTH_SECRET=$(openssl rand -base64 32)|" .env
          sed -i "s|^BOOTSTRAP_ADMIN_PASSWORD=.*|BOOTSTRAP_ADMIN_PASSWORD=ci-admin-password-123|" .env
          sed -i "s|^DEMO_USER_PASSWORD=.*|DEMO_USER_PASSWORD=ci-demo-password|" .env
          sed -i "s|^SEED_DEMO_WEEK=.*|SEED_DEMO_WEEK=true|" .env
      - name: Build and start the full stack
        run: docker compose up --build -d --wait
      - name: Health check
        run: curl --fail --silent http://localhost:3000/api/health
      - name: Bootstrap created the admin and reference data
        run: |
          docker compose exec -T db psql -U cpoint -d cpoint_pms -tAc "select count(*) from users where role='SYSTEM_ADMIN'" | grep -qx 1
          docker compose exec -T db psql -U cpoint -d cpoint_pms -tAc "select count(*) from defect_types" | grep -qx 4
      - name: The demo week seeds in the background, consistently
        run: |
          q() { docker compose exec -T db psql -U cpoint -d cpoint_pms -tAc "$1"; }
          for i in $(seq 1 60); do
            docker compose logs app | grep -q "Demo week seeded" && break
            sleep 3
          done
          docker compose logs app | grep "Demo week seeded"
          # How much of the week has passed depends on the weekday CI runs on.
          test "$(q "select count(*) from batches")" -ge 10
          test "$(q "select count(*) from scans")" -ge 150
          test "$(q "select count(*) from scans where status='PENDING_REVIEW'")" -ge 1
          # Every item's on-hand quantity equals the sum of its ledger.
          q "select count(*) from inventory_items i where i.\"quantityOnHand\" <> (select coalesce(sum(m.\"quantityDelta\"),0) from inventory_movements m where m.\"itemId\"=i.id)" | grep -qx 0
      - name: A restart doesn't seed again
        run: |
          q() { docker compose exec -T db psql -U cpoint -d cpoint_pms -tAc "$1"; }
          before="$(q "select count(*) from batches")"
          docker compose restart app
          docker compose up -d --wait
          sleep 10
          test "$(q "select count(*) from batches")" = "$before"
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v

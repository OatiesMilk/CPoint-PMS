name: CI

on:
  push:
    branches: [main] # work arrives by pull request (D-032)
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # onnxruntime-node downloads its CUDA build on Linux by default; CI never runs the model.
  ONNXRUNTIME_NODE_INSTALL: skip

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  station:
    # The model toolkit (cv/, D-048, D-069): lint, types and unit tests. No torch is installed here.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cv
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: cv/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: check
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: cpoint
          POSTGRES_PASSWORD: cpoint_ci_password
          POSTGRES_DB: cpoint_pms
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cpoint -d cpoint_pms"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://cpoint:cpoint_ci_password@localhost:5432/cpoint_pms?schema=public
      AUTH_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
      SEED_DEMO_USERS: "true"
      DEMO_USER_PASSWORD: ci-demo-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The Chromium download is cached by Playwright version; the system packages are installed
      # every run because they live outside the cache.
      - id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: npm run db:deploy
      - run: npm run build
      - run: npm run test:e2e

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: check
    steps:
      - uses: actions/checkout@v4
      - name: Write .env for the stack
        run: |
          cp .env.example .env
          sed -i "s|^AUTH_SECRET=.*|AUTH_SECRET=$(openssl rand -base64 32)|" .env
          sed -i "s|^BOOTSTRAP_ADMIN_PASSWORD=.*|BOOTSTRAP_ADMIN_PASSWORD=ci-admin-password-123|" .env
          sed -i "s|^DEMO_USER_PASSWORD=.*|DEMO_USER_PASSWORD=ci-demo-password|" .env
          sed -i "s|^SEED_DEMO_WEEK=.*|SEED_DEMO_WEEK=true|" .env
      - name: Build and start the full stack
        run: docker compose up --build -d --wait
      - name: Health check
        run: curl --fail --silent http://localhost:3000/api/health
      - name: Bootstrap created the admin and reference data
        run: |
          docker compose exec -T db psql -U cpoint -d cpoint_pms -tAc "select count(*) from users where role='SYSTEM_ADMIN'" | grep -qx 1
          docker compose exec -T db psql -U cpoint -d cpoint_pms -tAc "select count(*) from defect_types" | grep -qx 6
      - name: The demo week seeds in the background, consistently
        run: |
          q() { docker compose exec -T db psql -U cpoint -d cpoint_pms -tAc "$1"; }
          for i in $(seq 1 60); do
            docker compose logs app | grep -q "Demo week seeded" && break
            sleep 3
          done
          docker compose logs app | grep "Demo week seeded"
          # How much of the week has passed depends on the weekday CI runs on.
          test "$(q "select count(*) from batches")" -ge 10
          test "$(q "select count(*) from scans")" -ge 40
          # Pass or Reject only (D-093), and one section rejected for an unknown class (A-12).
          q "select count(*) from scans where \"finalVerdict\" is distinct from \"aiVerdict\"" | grep -qx 0
          test "$(q "select count(*) from detections where \"isUnknownClass\"")" -ge 1
          # Rolls at Capture (Phase 26): constructors with camera access capture on their phones,
          # the newest roll stays open and the Floor Manager cancelled one with a reason.
          test "$(q "select count(*) from users where \"canCapture\" and role='SHOE_CONSTRUCTOR'")" -ge 1
          test "$(q "select count(*) from batches where status='OPEN'")" -ge 1
          test "$(q "select count(*) from batches where status='CANCELLED' and \"cancelledReason\" is not null")" -eq 1
          q "select count(*) from scans where source <> 'PHONE'" | grep -qx 0
          # Batches (Phase 27): the default schedule and lunch, one daily quota, finished batches
          # with failed pairs, and no shoe types.
          test "$(q "select count(*) from production_schedules")" -eq 1
          test "$(q "select count(*) from lunch_breaks where \"startTime\"='11:00' and \"endTime\"='12:00'")" -eq 1
          test "$(q "select count(*) from daily_quotas")" -eq 1
          test "$(q "select count(*) from production_check_ins")" -ge 1
          test "$(q "select count(*) from production_check_ins where \"failedPairs\" > 0")" -ge 1
          test "$(q "select count(*) from information_schema.tables where table_name in ('shoe_types','production_counts')")" -eq 0
          # Every item's on-hand quantity equals the sum of its ledger.
          q "select count(*) from inventory_items i where i.\"quantityOnHand\" <> (select coalesce(sum(m.\"quantityDelta\"),0) from inventory_movements m where m.\"itemId\"=i.id)" | grep -qx 0
      - name: A restart doesn't seed again
        run: |
          q() { docker compose exec -T db psql -U cpoint -d cpoint_pms -tAc "$1"; }
          before="$(q "select count(*) from batches")"
          docker compose restart app
          docker compose up -d --wait
          sleep 10
          test "$(q "select count(*) from batches")" = "$before"
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v

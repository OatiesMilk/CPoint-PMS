# Model toolkit settings (predict, evaluate, export-onnx). Copy to cv/config.toml (git-ignored)
# and edit there. Environment overrides: CPOINT_CV_MODEL_PATH, CPOINT_CV_MODEL_DEVICE,
# CPOINT_CV_MODEL_IMGSZ, CPOINT_CV_CONFIDENCE_FLOOR. CPOINT_CV_CONFIG points at another file.

[model]
# Relative to this file's folder. Model files are never committed (D-049).
path = "models/yolo-v1.pt"
# modelVersion = name + the first 8 hex digits of the file's SHA-256.
name = "yolo-v1"
# The size the model was trained at.
imgsz = 1536
# "cpu", or "cuda:0" for the first NVIDIA GPU (needs the CUDA build of torch).
device = "cpu"
# SHA-256 of the file (cv/MODEL_CARD.md). predict warns when the file doesn't match.
sha256 = "1d729fb0358d3140d5491d4124e2173ec228e42875e06a31a69f4530d83f157b"

[mapper]
# Detections below this confidence are dropped as noise. export-onnx copies this into the
# JSON beside the model, so the Capture page uses the same floor. This is not the app's PASS
# threshold: the app decides verdicts (D-011).
confidence_floor = 0.25
# At most 50, the app's limit per scan. The strongest are kept.
max_detections = 50
# Two boxes of the same class overlapping this much (intersection over union, 0 to 1) are one
# defect the model reported twice: only the more confident is kept. 0 keeps every box.
overlap_iou = 0.7

[mapper.rename]
# Optional: report a model class under another key, e.g.
# crease = "wrinkle"

[preview]
# Only for the verdict preview that predict and evaluate print. Copy these from Admin > Settings
# so the preview matches the app. The app decides the real verdict: Pass or Reject (D-093).
# Defect types as they are in Settings once the yolo-v1 classes are set up (cv/README.md,
# "Defect types for yolo-v1", D-052): the model's four classes active, the two it never sends off.
active_keys = ["crease", "cut", "hole", "scratch"]
inactive_keys = ["abrasion", "dirt"]
# "A defect counts as found at" in Settings > Thresholds (D-053). Below it a detection counts
# for nothing; a class the app doesn't know always rejects the section.
found_at_or_above = 0.50

[preview.outcomes]
# Each active defect type's "When found" in Settings > Defect types: USABLE (Pass) or
# NOT_ACCEPTED (Reject). These match npm run demo:reset and CPoint's answers (C-14 to C-17).
crease = "USABLE"
cut = "NOT_ACCEPTED"
hole = "NOT_ACCEPTED"
scratch = "USABLE"

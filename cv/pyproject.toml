[project]
name = "cpoint-cv"
version = "0.20.0"
description = "CPoint model toolkit: runs, checks and exports the YOLO model for the website's Capture page."
requires-python = ">=3.13"

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = [".venv", "models", "out"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["cpoint_cv", "tests"]

[[tool.mypy.overrides]]
# Optional at test time: the unit tests run without torch, ultralytics, OpenCV or onnx.
module = [
  "ultralytics", "ultralytics.*", "torch", "torch.*", "cv2", "numpy", "numpy.*", "PIL", "PIL.*",
  "onnx", "onnx.*", "onnxslim", "onnxslim.*",
]
ignore_missing_imports = true
# Same result with or without them installed: treat them as untyped.
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
